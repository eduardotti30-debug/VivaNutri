<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <g filter="url(#iconGlow)">
    <!-- Nutrition Green Leaf (Top) -->
    <path 
      d="M256 120 C256 80 300 64 340 68 C344 108 328 152 288 152 C270 152 256 138 256 120 Z" 
      fill="url(#leafGrad)" 
    />
    <!-- Leaf Stem -->
    <path 
      d="M256 128 Q248 100 236 84" 
      stroke="#ffffff" 
      stroke-width="10" 
      stroke-linecap="round" 
      fill="none" 
    />

    <!-- Health Apple / Heart Silhouette (Solid White) -->
    <path 
      d="M256 180 
         C235 150 160 145 125 185 
         C85 230 85 300 135 365 
         C175 415 225 448 256 455 
         C287 448 337 415 377 365 
         C427 300 427 230 387 185 
         C352 145 277 150 256 180 Z" 
      fill="#ffffff" 
    />

    <!-- Health Vitality Pulse / Heartbeat Line (Cyan-Emerald) -->
    <path 
      d="M140 295 
         L195 295 
         L220 235 
         L255 355 
         L290 260 
         L315 295 
         L372 295" 
      stroke="#0284c7" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />

    <!-- Health Cross / Sparkle Symbol (Top Right of Heart) -->
    <circle cx="340" cy="225" r="14" fill="#10b981" />
  </g>
</svg>
