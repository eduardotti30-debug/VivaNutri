<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#pwaGrad)" />
  
  <!-- Inner White Card for Contrast -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.15" />
  
  <!-- Nutrition & Health Leaf + Shield Icon -->
  <g transform="translate(106, 106) scale(0.5859)" filter="url(#shadow)">
    <!-- Organic Leaf Shape -->
    <path 
      d="M256 60 C140 60 80 180 80 320 C80 430 170 480 256 480 C342 480 432 430 432 320 C432 180 372 60 256 60 Z" 
      fill="#ffffff" 
    />
    <!-- Central Sprout / Heart Vein -->
    <path 
      d="M256 140 C256 260 210 360 140 400 M256 260 C290 230 350 240 370 300 M256 330 C280 320 320 330 330 370" 
      stroke="#0284c7" 
      stroke-width="24" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />
    <!-- Vitality Sparkle Dot -->
    <circle cx="256" cy="140" r="20" fill="#10b981" />
  </g>
</svg>
