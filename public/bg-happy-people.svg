<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="happyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <linearGradient id="peopleGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="peopleGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="peopleGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.22" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <!-- Base Gradient -->
  <rect width="1920" height="1080" fill="url(#happyBgGrad)" />

  <!-- Ambient Vitality Light Centers -->
  <circle cx="400" cy="300" r="450" fill="#bae6fd" opacity="0.4" filter="url(#softBlur)" />
  <circle cx="1500" cy="350" r="480" fill="#a7f3d0" opacity="0.45" filter="url(#softBlur)" />
  <circle cx="960" cy="850" r="500" fill="#ccfbf1" opacity="0.35" filter="url(#softBlur)" />

  <!-- Flowing Wellness Waves -->
  <path d="M-100 820 C350 720, 750 900, 1200 780 C1580 680, 1820 800, 2020 750 L2020 1150 L-100 1150 Z" fill="#ffffff" opacity="0.75" />
  <path d="M-100 900 C400 800, 850 960, 1300 840 C1650 760, 1880 870, 2020 840 L2020 1150 L-100 1150 Z" fill="#f8fafc" opacity="0.9" />

  <!-- Group of Happy, Healthy People Celebrating Wellness & Nutrition -->

  <!-- Person 1: Happy Woman High-Five / Thumbs Up (Left) -->
  <g transform="translate(340, 430) scale(0.95)" fill="url(#peopleGrad1)">
    <!-- Smiling Head -->
    <circle cx="120" cy="35" r="22" />
    <!-- Hair / Profile -->
    <path d="M102 20 C100 45, 110 55, 135 50 C142 35, 138 20, 120 15 Z" opacity="0.4" />
    <!-- Torso -->
    <path d="M112 62 C128 62, 135 78, 130 130 L105 130 C100 95, 102 72, 112 62 Z" />
    <!-- Raised Arm waving / thumbs up in happiness -->
    <path d="M125 72 L165 40 L175 15" stroke="url(#peopleGrad1)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M108 72 L85 105 L70 120" stroke="url(#peopleGrad1)" stroke-width="16" stroke-linecap="round" fill="none" />
    <!-- Relaxed Happy Stance -->
    <path d="M124 128 L135 200 L140 270" stroke="url(#peopleGrad1)" stroke-width="18" stroke-linecap="round" fill="none" />
    <path d="M108 128 L95 200 L90 270" stroke="url(#peopleGrad1)" stroke-width="18" stroke-linecap="round" fill="none" />
  </g>

  <!-- Person 2: Happy Man with Open Arms Celebrating Good Health (Center-Right) -->
  <g transform="translate(1320, 410) scale(1.0)" fill="url(#peopleGrad2)">
    <!-- Head -->
    <circle cx="120" cy="30" r="24" />
    <!-- Torso -->
    <path d="M110 58 C130 58, 140 75, 135 135 L102 135 C95 95, 95 70, 110 58 Z" />
    <!-- Open Welcoming Happy Arms -->
    <path d="M128 70 L185 50 L220 35" stroke="url(#peopleGrad2)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M105 70 L50 50 L15 35" stroke="url(#peopleGrad2)" stroke-width="16" stroke-linecap="round" fill="none" />
    <!-- Confident Healthy Legs -->
    <path d="M128 132 L150 200 L165 275" stroke="url(#peopleGrad2)" stroke-width="18" stroke-linecap="round" fill="none" />
    <path d="M105 132 L85 200 L70 275" stroke="url(#peopleGrad2)" stroke-width="18" stroke-linecap="round" fill="none" />
  </g>

  <!-- Person 3 & 4: Happy Couple / Nutritionist and Patient smiling together (Center Left) -->
  <g transform="translate(780, 450) scale(0.88)" fill="url(#peopleGrad3)">
    <circle cx="100" cy="35" r="21" />
    <path d="M92 60 C110 60, 118 75, 112 128 L88 128 C82 92, 85 70, 92 60 Z" />
    <path d="M105 70 L140 95 L165 90" stroke="url(#peopleGrad3)" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M90 70 L65 100 L55 125" stroke="url(#peopleGrad3)" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M106 126 L120 195 L125 260" stroke="url(#peopleGrad3)" stroke-width="17" stroke-linecap="round" fill="none" />
    <path d="M90 126 L78 195 L72 260" stroke="url(#peopleGrad3)" stroke-width="17" stroke-linecap="round" fill="none" />

    <!-- Companion smiling nearby -->
    <circle cx="210" cy="45" r="19" />
    <path d="M204 68 C220 68, 225 80, 220 128 L198 128 C192 95, 195 78, 204 68 Z" />
    <path d="M214 78 L250 100" stroke="url(#peopleGrad3)" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M200 78 L170 95" stroke="url(#peopleGrad3)" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M214 126 L225 190 L230 250" stroke="url(#peopleGrad3)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M200 126 L190 190 L185 250" stroke="url(#peopleGrad3)" stroke-width="16" stroke-linecap="round" fill="none" />
  </g>

  <!-- Happiness & Vitality Floating Hearts, Sparkles & Leaves -->
  <!-- Floating Health Heart 1 -->
  <path d="M520 280 C505 250 460 250 445 280 C430 310 480 340 520 370 C560 340 610 310 595 280 C580 250 535 250 520 280 Z" fill="#10b981" opacity="0.22" />
  
  <!-- Floating Health Heart 2 -->
  <path d="M1250 240 C1240 215 1205 215 1195 240 C1180 265 1220 290 1250 315 C1280 290 1320 265 1305 240 C1295 215 1260 215 1250 240 Z" fill="#0284c7" opacity="0.25" />

  <!-- Nutrition Green Leaves of Happiness -->
  <path d="M220 320 C245 295, 290 305, 295 340 C265 360, 235 350, 220 320 Z" fill="#10b981" opacity="0.35" />
  <path d="M1680 500 C1705 475, 1750 485, 1755 520 C1725 540, 1695 530, 1680 500 Z" fill="#0ea5e9" opacity="0.3" />
</svg>
