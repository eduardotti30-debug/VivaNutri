<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="auth-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="80%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="grad-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#auth-sky)"/>

  <circle cx="250" cy="200" r="320" fill="url(#grad-teal)" filter="url(#blur-glow)"/>
  <circle cx="1700" cy="850" r="400" fill="url(#grad-leaf)" filter="url(#blur-glow)"/>
  <circle cx="1650" cy="150" r="260" fill="url(#grad-teal)" filter="url(#blur-glow)"/>
  <circle cx="180" cy="900" r="280" fill="url(#grad-leaf)" filter="url(#blur-glow)"/>

  <g transform="translate(80, 120) scale(1.1)" opacity="0.22">
    <path d="M 100,280 C 100,140 220,100 320,100 C 320,240 200,280 100,280 Z" fill="#0d9488"/>
    <path d="M 100,280 Q 210,190 320,100" stroke="#ffffff" stroke-width="4" fill="none"/>
    <path d="M 200,320 C 170,220 260,180 340,190 C 320,290 230,320 200,320 Z" fill="#059669"/>
  </g>

  <path d="M -100,540 Q 300,480 600,560 T 1200,520 T 2020,550" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="8 8" opacity="0.15"/>

  <g transform="translate(1550, 480) scale(0.9)" opacity="0.2">
    <path d="M 150,50 C 150,50 50,190 50,270 C 50,340 100,390 150,390 C 200,390 250,340 250,270 C 250,190 150,50 150,50 Z" fill="#0284c7"/>
    <circle cx="150" cy="270" r="160" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="6 6"/>
  </g>
</svg>