<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="runnerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="runnerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.06" />
    </linearGradient>

    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Base Clean Background -->
  <rect width="1920" height="1080" fill="#f8fafc" />
  <rect width="1920" height="1080" fill="url(#skyGrad1)" />

  <!-- Ambient Morning Sun and Glowing Health Spheres -->
  <circle cx="300" cy="200" r="350" fill="url(#sunGrad)" filter="url(#blurSoft)" />
  <circle cx="1600" cy="300" r="400" fill="#38bdf8" opacity="0.15" filter="url(#blurSoft)" />
  <circle cx="1200" cy="800" r="450" fill="#34d399" opacity="0.18" filter="url(#blurSoft)" />

  <!-- Dynamic Running Tracks & Vitality Waves -->
  <path d="M-100 850 C400 700, 800 950, 1300 780 C1650 650, 1850 820, 2050 760 L2050 1150 L-100 1150 Z" fill="url(#trackGrad)" />
  <path d="M-100 920 C450 780, 900 990, 1400 840 C1750 740, 1950 890, 2050 860 L2050 1150 L-100 1150 Z" fill="#ffffff" opacity="0.6" />

  <!-- Energy Cardio Pulse Flow -->
  <path d="M0 650 Q300 630 600 650 T1000 640 L1080 540 L1130 730 L1180 590 L1220 650 T1920 640" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="8 8" opacity="0.35" />

  <!-- Modern Athletic Runners Graphic Silhouettes (Clean, Stylized, Young) -->
  <!-- Runner 1 (Foreground Athlete in Motion) -->
  <g transform="translate(1180, 420) scale(0.95)" fill="url(#runnerGrad2)">
    <!-- Head -->
    <circle cx="120" cy="30" r="22" />
    <!-- Torso -->
    <path d="M110 58 C125 58, 145 75, 140 130 L105 140 C95 100, 95 70, 110 58 Z" />
    <!-- Arms -->
    <path d="M125 70 L170 100 L195 90" stroke="url(#runnerGrad2)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M105 75 L70 105 L50 95" stroke="url(#runnerGrad2)" stroke-width="16" stroke-linecap="round" fill="none" />
    <!-- Legs in powerful running stride -->
    <path d="M130 135 L175 200 L230 220" stroke="url(#runnerGrad2)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M105 138 L65 190 L40 260" stroke="url(#runnerGrad2)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Runner 2 (Companion Athlete Running Outdoors) -->
  <g transform="translate(1380, 460) scale(0.85)" fill="url(#runnerGrad1)">
    <!-- Head -->
    <circle cx="115" cy="35" r="20" />
    <!-- Torso -->
    <path d="M108 60 C120 60, 138 75, 132 125 L100 135 C90 95, 92 70, 108 60 Z" />
    <!-- Arms -->
    <path d="M120 70 L155 95 L175 85" stroke="url(#runnerGrad1)" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M100 75 L75 100 L60 90" stroke="url(#runnerGrad1)" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Legs -->
    <path d="M125 130 L160 185 L205 205" stroke="url(#runnerGrad1)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M100 133 L70 180 L50 240" stroke="url(#runnerGrad1)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Runner 3 (Left Perspective Morning Jogger) -->
  <g transform="translate(220, 520) scale(0.75)" fill="url(#runnerGrad1)" opacity="0.6">
    <circle cx="115" cy="35" r="20" />
    <path d="M108 60 C120 60, 138 75, 132 125 L100 135 C90 95, 92 70, 108 60 Z" />
    <path d="M120 70 L160 95 L180 85" stroke="url(#runnerGrad1)" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M100 75 L75 100 L60 90" stroke="url(#runnerGrad1)" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M125 130 L165 185 L215 205" stroke="url(#runnerGrad1)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M100 133 L68 180 L48 245" stroke="url(#runnerGrad1)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Decorative Nutrition & Vitality Leaves Floating in the Breeze -->
  <path d="M350 320 C370 300, 410 310, 415 340 C390 355, 360 345, 350 320 Z" fill="#10b981" opacity="0.3" />
  <path d="M1520 220 C1540 195, 1585 205, 1590 240 C1560 255, 1530 245, 1520 220 Z" fill="#0284c7" opacity="0.25" />
  <path d="M1650 680 C1670 660, 1710 670, 1715 700 C1690 715, 1660 705, 1650 680 Z" fill="#34d399" opacity="0.35" />
</svg>
